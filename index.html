<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aedes of Elysiae</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <!-- Bagian kiri -->
        <section class="left-side">
            <div class="logo-box">A</div>

            <h1>Aedes of Elysiae</h1>

            <p>
                Welcome to Aedes of Elysiae.
                Please sign in to continue.
            </p>

            <div class="decoration">
                <div class="circle"></div>
                <div class="square"></div>
            </div>
        </section>


        <!-- Bagian kanan -->
        <section class="right-side">

            <div class="login-box">

                <h2>Sign In</h2>

                <p class="subtitle">
                    Sign in to your account
                </p>


                <form>

                    <!-- Google -->
                    <button type="button" class="google-button">
                        <span>G</span>
                        Sign in with Google
                    </button>


                    <!-- Divider -->
                    <div class="divider">
                        <span></span>
                        <p>or</p>
                        <span></span>
                    </div>


                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">
                            Email or Username
                        </label>

                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="Enter your email or username"
                            required
                        >
                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <div class="password-title">
                            <label for="password">
                                Password
                            </label>

                            <a href="#">
                                Forgot Password?
                            </a>
                        </div>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <!-- Remember -->
                    <div class="remember">
                        <label>
                            <input type="checkbox">
                            Remember Me
                        </label>
                    </div>


                    <!-- Sign In -->
                    <button type="submit" class="signin-button">
                        Sign In
                    </button>

                </form>


                <p class="register">
                    Don't have an account?
                    <a href="#">Create an account</a>
                </p>

            </div>

        </section>

    </main>

</body>
</html>
